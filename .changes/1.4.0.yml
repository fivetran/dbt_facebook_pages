version: 1.4.0
schema_data_changes:
  entries:
  - models:
    - stg_facebook_pages__lifetime_post_metrics_by_paid_organic
    - stg_facebook_pages__lifetime_post_metrics_by_followers
    - stg_facebook_pages__daily_page_metrics_by_paid_organic
    - stg_facebook_pages__lifetime_post_metrics_by_paid_organic_tmp
    - stg_facebook_pages__lifetime_post_metrics_by_followers_tmp
    - stg_facebook_pages__daily_page_metrics_by_paid_organic_tmp
    change_type: New field/model
    is_breaking: false
    notes: Stages the `lifetime_post_metrics_by_paid_organic`, `lifetime_post_metrics_by_followers`,
      and `daily_page_metrics_by_paid_organic` source tables, which Fivetran added
      in December 2025 to replace the impressions metrics Facebook deprecated on November
      15, 2025.
  - models:
    - facebook_pages__posts_report
    change_type: New field/model
    new: '`media_views_paid`, `media_views_organic`, `media_views_followers`, `media_views_non_followers`'
    is_breaking: false
    notes: Sourced from the new post media view tables. `media_views_paid`, `media_views_organic`,
      and `media_views_followers` fall back to the deprecated `impressions_paid`,
      `impressions_organic`, and `impressions_fan` fields to keep historical values.
      `media_views_non_followers` has no fallback and is only present when `facebook_pages__using_lifetime_post_metrics_by_followers`
      is true.
  - models:
    - facebook_pages__pages_report
    change_type: New field/model
    new: '`media_views_paid`, `media_views_organic`'
    is_breaking: false
    notes: Sourced from the new `daily_page_metrics_by_paid_organic` table. Falls
      back to the deprecated `impressions_paid` and `impressions_organic` fields to
      keep historical values.
  - models:
    - facebook_pages__posts_report
    - facebook_pages__pages_report
    change_type: Changed field/model
    old: '`media_views` sourced only from the `post_media_view` or `page_media_view`
      field.'
    new: '`media_views` falls back to the deprecated `impressions` field when media
      views are not available.'
    is_breaking: false
    notes: Keeps a continuous view metric across records from before and after the
      November 2025 deprecation.
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_facebook_pages/issues/new/choose).
- title: Media view breakdown variables
  description: Adds the `facebook_pages__using_lifetime_post_metrics_by_paid_organic`,
    `facebook_pages__using_lifetime_post_metrics_by_followers`, and `facebook_pages__using_daily_page_metrics_by_paid_organic`
    variables. Each defaults to `true`. Set a variable to `false` if your connection
    doesn't sync that table.
date: '2026-11-18'
